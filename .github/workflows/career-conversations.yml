name: Career conversation pilot checks
on:
  pull_request:
    paths:
      - 'app/ai-roadmap.php'
      - 'app/four-hubs-ai.php'
      - 'app/career-conversations*.php'
      - 'app/home-hubs.php'
      - 'data/career-conversations/**'
      - 'tests/career-conversations*'
      - '.github/workflows/career-conversations.yml'
  push:
    branches: [main]
    paths:
      - 'app/ai-roadmap.php'
      - 'app/four-hubs-ai.php'
      - 'app/career-conversations*.php'
      - 'app/home-hubs.php'
      - 'data/career-conversations/**'
      - 'tests/career-conversations*'
      - '.github/workflows/career-conversations.yml'
jobs:
  pilot:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.1', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite, mbstring, ctype
          coverage: none
      - run: |
          set -e
          for file in app/ai-roadmap.php app/four-hubs-ai.php app/career-conversations.php app/career-conversations-view.php app/home-hubs.php; do php -l "$file"; done
          php tests/career-conversations-test.php
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install requests
          python tests/career-conversations-http.py
